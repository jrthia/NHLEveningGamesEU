let currentTz = 'utc0';
function selectTz(tz) {
  currentTz = tz;
  document.querySelectorAll('.tz-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + tz).classList.add('active');
  renderGames();
}
function renderGames() {
  const games = allData[currentTz].games;
  document.getElementById('game-count').textContent = games.length + ' evening games this season';
  const byDate = {};
  games.forEach(g => { if (!byDate[g.date]) byDate[g.date] = []; byDate[g.date].push(g); });
  let html = '';
  Object.keys(byDate).sort().forEach(date => {
    html += '<div class="date-header">' + date + '</div>';
    byDate[date].forEach(g => {
      html += '<div class="game-card">'
        + '<div class="teams">' + g.away + ' <span class="abbrev">(' + g.away_abbrev + ')</span>'
        + '<span class="vs"> @ </span>' + g.home + ' <span class="abbrev">(' + g.home_abbrev + ')</span></div>'
        + '<div class="details">🕐 ' + g.times[currentTz] + ' | 📍 ' + g.venue + '</div>'
        + '</div>';
    });
  });
  document.getElementById('games-container').innerHTML = html;
}
window.onload = function() { selectTz('utc0'); };
