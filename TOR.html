<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toronto Maple Leafs - Sleep Schedule Friendly NHL</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');body { background: #0d1117; color: #e0e0e0; font-family: 'Inter', sans-serif; padding: 20px; }h1 { color: #4fc3f7; text-align: center; letter-spacing: 2px; }h2 { color: #888; text-align: center; margin-top: -10px; margin-bottom: 10px; font-size: 15px; }.subheading { text-align: center; color: #888; font-size: 13px; margin-top: 0; margin-bottom: 20px; }.date-header { color: #4fc3f7; font-size: 15px; font-weight: bold; margin-top: 24px; margin-bottom: 8px; border-bottom: 1px solid #1e3a2f; padding-bottom: 4px; }.game-card { background: #161b22; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }.teams { font-size: 16px; color: #e0e0e0; }.abbrev { color: #ff4444; font-size: 15px; }.vs { color: #4fc3f7; font-weight: bold; margin: 0 6px; }.details { color: #ffffff; font-size: 16px; margin-top: 6px; }.count { color: #ffb74d; text-align: center; margin-bottom: 20px; font-size: 15px; }.back { display: block; text-align: center; color: #888; margin-bottom: 20px; text-decoration: none; font-size: 14px; }.download { display: block; width: 200px; margin: 0 auto 20px; padding: 10px; background: #1e3a5f; color: #4fc3f7; text-align: center; border-radius: 8px; text-decoration: none; font-size: 15px; }.tz-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }.tz-btn { padding: 8px 12px; background: #161b22; border: 1px solid #1e3a5f; border-radius: 8px; color: #888; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; }.tz-btn.active { border-color: #4fc3f7; color: #4fc3f7; background: #0d2137; }.tz-btn:hover { border-color: #4fc3f7; color: #4fc3f7; }.all-link { display: block; text-align: center; color: #4fc3f7; margin-bottom: 16px; text-decoration: none; font-size: 16px; }.all-link:hover { text-decoration: underline; }.all-btn { display: block; width: 250px; margin: 0 auto 30px; padding: 12px; background: #1e3a5f; color: #4fc3f7; text-align: center; border-radius: 8px; text-decoration: none; font-size: 15px; }.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }.team-card { display: flex; align-items: center; background: #161b22; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; text-decoration: none; color: #e0e0e0; }.team-card:hover { border-color: #4fc3f7; }.team-color { width: 12px; height: 40px; border-radius: 4px; margin-right: 12px; flex-shrink: 0; }.team-name { font-size: 15px; font-weight: bold; }.team-count { font-size: 13px; color: #888; margin-top: 3px; }</style>
</head>
<body>
<h1>Toronto Maple Leafs</h1>
<h2>NHL games before midnight in Europe — 2026-27</h2>
<div class="tz-selector">
<button class="tz-btn active" id="btn-utc0" onclick="selectTz('utc0')">GMT/BST — Ireland & UK</button>
<button class="tz-btn" id="btn-utc1" onclick="selectTz('utc1')">CET/CEST — North & Central Europe</button>
<button class="tz-btn" id="btn-utc2" onclick="selectTz('utc2')">EET/EEST — Finland, Baltics & Eastern Europe</button>
</div>
<a class="back" href="./index.html">← Back to all teams</a>
<a class="download" id="ics-link" href="./ics/TOR-utc0.ics" download="TOR-utc0.ics">📅 Download Calendar (.ics)</a>
<p class="count" id="game-count"></p>
<div id="games-container"></div>
<script>const allGames = {"utc0": [{"date": "2026-11-27", "away": "Maple Leafs", "away_abbrev": "TOR", "home": "Bruins", "home_abbrev": "BOS", "venue": "TD Garden", "utc_hour": 18, "utc_minute": 0, "times": {"utc0": "18:00 GMT", "utc1": "19:00 CET", "utc2": "20:00 EET"}, "viewable": {"utc0": true, "utc1": true, "utc2": true}}, {"date": "2026-12-21", "away": "Capitals", "away_abbrev": "WSH", "home": "Maple Leafs", "home_abbrev": "TOR", "venue": "Scotiabank Arena", "utc_hour": 18, "utc_minute": 0, "times": {"utc0": "18:00 GMT", "utc1": "19:00 CET", "utc2": "20:00 EET"}, "viewable": {"utc0": true, "utc1": true, "utc2": true}}], "utc1": [{"date": "2026-11-27", "away": "Maple Leafs", "away_abbrev": "TOR", "home": "Bruins", "home_abbrev": "BOS", "venue": "TD Garden", "utc_hour": 18, "utc_minute": 0, "times": {"utc0": "18:00 GMT", "utc1": "19:00 CET", "utc2": "20:00 EET"}, "viewable": {"utc0": true, "utc1": true, "utc2": true}}, {"date": "2026-12-21", "away": "Capitals", "away_abbrev": "WSH", "home": "Maple Leafs", "home_abbrev": "TOR", "venue": "Scotiabank Arena", "utc_hour": 18, "utc_minute": 0, "times": {"utc0": "18:00 GMT", "utc1": "19:00 CET", "utc2": "20:00 EET"}, "viewable": {"utc0": true, "utc1": true, "utc2": true}}], "utc2": [{"date": "2026-11-27", "away": "Maple Leafs", "away_abbrev": "TOR", "home": "Bruins", "home_abbrev": "BOS", "venue": "TD Garden", "utc_hour": 18, "utc_minute": 0, "times": {"utc0": "18:00 GMT", "utc1": "19:00 CET", "utc2": "20:00 EET"}, "viewable": {"utc0": true, "utc1": true, "utc2": true}}, {"date": "2026-12-21", "away": "Capitals", "away_abbrev": "WSH", "home": "Maple Leafs", "home_abbrev": "TOR", "venue": "Scotiabank Arena", "utc_hour": 18, "utc_minute": 0, "times": {"utc0": "18:00 GMT", "utc1": "19:00 CET", "utc2": "20:00 EET"}, "viewable": {"utc0": true, "utc1": true, "utc2": true}}]};
let currentTz = 'utc0';
function selectTz(tz) {
  currentTz = tz;
  document.querySelectorAll('.tz-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + tz).classList.add('active');
  renderGames();
  document.getElementById('ics-link').href = './ics/' + abbrev + '-' + tz + '.ics';
  document.getElementById('ics-link').download = 'TOR-' + tz + '.ics';
}
function renderGames() {
  const games = allGames[currentTz];
  document.getElementById('game-count').textContent = games.length + ' games before midnight this season';
  const byDate = {};
  games.forEach(g => { if (!byDate[g.date]) byDate[g.date] = []; byDate[g.date].push(g); });
  let html = '';
  Object.keys(byDate).sort().forEach(date => {
    html += '<div class="date-header">' + date + '</div>';
    byDate[date].forEach(g => {
      html += '<div class="game-card">'
        + '<div class="teams">' + g.away + ' <span class="abbrev">(' + g.away_abbrev + ')</span>'
        + '<span class="vs"> @ </span>' + g.home + ' <span class="abbrev">(' + g.home_abbrev + ')</span></div>'
        + '<div class="details">🕐 ' + g.times[currentTz] + ' | 📍 ' + g.venue + '</div>'
        + '</div>';
    });
  });
  document.getElementById('games-container').innerHTML = html;
}
window.onload = function() { selectTz('utc0'); };
</script>
</body>
</html>
